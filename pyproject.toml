[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-financial-rag"
version = "0.1.0"
description = "A learning-focused RAG platform for SEC financial filings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1,<2",
    "beautifulsoup4>=4.12,<5",
    "pillow>=10,<13",
    "python-dotenv>=1.0,<2",
    "qdrant-client>=1.18,<2",
    "requests>=2.32,<3",
    "sentence-transformers>=5.6,<6",
    "torch>=2,<3",
    "torchvision>=0.20,<1",
    "transformers>=5.10.1,<6",
]

[project.scripts]
financial-rag = "financial_rag.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
